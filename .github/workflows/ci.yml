name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  server:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # rustup installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy -p xray-server --all-targets -- -Dwarnings
      - run: >-
          cargo test --lib --bins
          -p xray-server -p xray-config -p xray-proxy -p xray-transport
          -p xray-routing -p xray-utls -p xray-vless-encryption -p xray-wireguard
      - run: cargo test -p xray-config --test tooling_tests
      - run: cargo build --release -p xray-server
      - uses: actions/upload-artifact@v4
        with:
          name: xray-server-linux-amd64
          path: target/release/xray-server
