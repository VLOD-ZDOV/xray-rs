name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # rustup installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup show active-toolchain
      - run: cargo test -p xray-server
      - name: Build
        # Keep the runner's home and checkout paths out of the binary.
        run: >-
          RUSTFLAGS="--remap-path-prefix=$HOME=~ --remap-path-prefix=$PWD=."
          cargo build --release -p xray-server
      - name: Check glibc requirement
        # README promises glibc 2.34; src/compat.c covers newer C23 symbols.
        run: |
          need=$(objdump -T target/release/xray-server | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1)
          echo "requires $need"
          [ "$(printf '%s\nGLIBC_2.34\n' "$need" | sort -V | tail -1)" = GLIBC_2.34 ]
      - name: Package
        run: |
          cp target/release/xray-server xray-linux-amd64
          sha256sum xray-linux-amd64 > xray-linux-amd64.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            xray-linux-amd64
            xray-linux-amd64.sha256
