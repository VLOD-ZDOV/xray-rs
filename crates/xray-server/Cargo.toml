[package]
name = "xray-server"
version = "26.10.31"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Xray-compatible VLESS over XHTTP server core"

[[bin]]
name = "xray-server"
path = "src/main.rs"

[dependencies]
async-trait = { workspace = true }
bytes.workspace = true
futures-util.workspace = true
base64.workspace = true
http.workspace = true
http-body-util = "0.1"
prost.workspace = true
h2 = { workspace = true }
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "tokio", "http1", "http2"] }
libc.workspace = true
rand.workspace = true
regex.workspace = true
rustls = { workspace = true }
serde_json.workspace = true
sha1.workspace = true
sha2.workspace = true
socket2 = { version = "0.6.5", features = ["all"] }
tokio-tfo = "0.4.3"
aws-lc-rs.workspace = true
aes-gcm.workspace = true
blake2.workspace = true
chacha20poly1305.workspace = true
ml-dsa.workspace = true
h3.workspace = true
h3-quinn.workspace = true
hkdf.workspace = true
hmac.workspace = true
quinn.workspace = true
quinn-proto.workspace = true
x25519-dalek.workspace = true
zeroize.workspace = true
tokio = { workspace = true, features = ["fs"] }
tokio-rustls.workspace = true
uuid = { workspace = true, features = ["v5"] }
rcgen = { workspace = true, features = ["pem", "x509-parser"] }
x509-parser = { workspace = true }
xray-config = { path = "../xray-config" }
xray-proxy = { path = "../xray-proxy" }
xray-routing = { path = "../xray-routing" }
xray-transport = { path = "../xray-transport" }
xray-vless-encryption = { path = "../xray-vless-encryption" }
xray-wireguard = { path = "../xray-wireguard" }

[build-dependencies]
cc = "1.2"
