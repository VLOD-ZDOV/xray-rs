[package]
name = "xray-server"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Xray-compatible VLESS over XHTTP server core"

[[bin]]
name = "xray-server"
path = "src/main.rs"

[dependencies]
bytes.workspace = true
futures-util.workspace = true
base64.workspace = true
http.workspace = true
http-body-util = "0.1"
prost.workspace = true
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "tokio", "http1", "http2"] }
rand.workspace = true
regex.workspace = true
rustls = { workspace = true }
serde_json.workspace = true
sha1.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["fs"] }
tokio-rustls.workspace = true
uuid = { workspace = true, features = ["v5"] }
xray-config = { path = "../xray-config" }
xray-proxy = { path = "../xray-proxy" }
xray-routing = { path = "../xray-routing" }
xray-wireguard = { path = "../xray-wireguard" }

[build-dependencies]
cc = "1.2"
